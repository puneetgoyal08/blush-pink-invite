<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="The groom seen from behind, seated on a low stool while hands apply haldi to his shoulders">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF4E2"/>
      <stop offset="1" stop-color="#F4E2B6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#FFF6D6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFF6D6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B9784A"/>
      <stop offset="0.5" stop-color="#CC8D5C"/>
      <stop offset="1" stop-color="#B57347"/>
    </linearGradient>
    <linearGradient id="dhoti" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="1" stop-color="#EFE6CF"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A97C2F"/>
      <stop offset="0.45" stop-color="#E3C26E"/>
      <stop offset="1" stop-color="#9C7028"/>
    </linearGradient>
    <g id="mari">
      <circle r="11" fill="#E8892A"/>
      <circle r="7.5" fill="#F2A23A"/>
      <circle r="3.5" fill="#F7C35B"/>
    </g>
    <g id="mariY">
      <circle r="11" fill="#EDB421"/>
      <circle r="7.5" fill="#F5C93F"/>
      <circle r="3.5" fill="#FADD75"/>
    </g>
    <path id="leaf" d="M0 0 C 8 10, 8 26, 0 38 C -8 26, -8 10, 0 0 Z" fill="#6E8B4E"/>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <!-- floor and rangoli -->
  <path d="M0 470 H800 V600 H0 Z" fill="#EBD39B"/>
  <path d="M0 470 H800" stroke="#C8A462" stroke-width="2"/>
  <g transform="translate(400 545)" fill="none" stroke-width="3">
    <ellipse rx="250" ry="42" stroke="#E8892A" opacity="0.55"/>
    <ellipse rx="215" ry="34" stroke="#C8A462" opacity="0.6" stroke-dasharray="2 9" stroke-linecap="round"/>
  </g>

  <!-- side garlands -->
  <g>
    <use href="#mari" x="40" y="90"/><use href="#mariY" x="40" y="112"/><use href="#mari" x="40" y="134"/><use href="#mariY" x="40" y="156"/><use href="#mari" x="40" y="178"/><use href="#mariY" x="40" y="200"/><use href="#mari" x="40" y="222"/><use href="#mariY" x="40" y="244"/><use href="#mari" x="40" y="266"/><use href="#mariY" x="40" y="288"/><use href="#mari" x="40" y="310"/><use href="#mariY" x="40" y="332"/><use href="#mari" x="40" y="354"/>
    <use href="#mariY" x="78" y="90"/><use href="#mari" x="78" y="112"/><use href="#mariY" x="78" y="134"/><use href="#mari" x="78" y="156"/><use href="#mariY" x="78" y="178"/><use href="#mari" x="78" y="200"/><use href="#mariY" x="78" y="222"/><use href="#mari" x="78" y="244"/><use href="#mariY" x="78" y="266"/>
    <use href="#mari" x="760" y="20"/><use href="#mariY" x="760" y="42"/><use href="#mari" x="760" y="64"/><use href="#mariY" x="760" y="86"/><use href="#mari" x="760" y="108"/><use href="#mariY" x="760" y="130"/><use href="#mari" x="760" y="152"/><use href="#mariY" x="760" y="174"/><use href="#mari" x="760" y="196"/><use href="#mariY" x="760" y="218"/><use href="#mari" x="760" y="240"/><use href="#mariY" x="760" y="262"/><use href="#mari" x="760" y="284"/>
    <use href="#mariY" x="722" y="20"/><use href="#mari" x="722" y="42"/><use href="#mariY" x="722" y="64"/><use href="#mari" x="722" y="86"/><use href="#mariY" x="722" y="108"/><use href="#mari" x="722" y="130"/><use href="#mariY" x="722" y="152"/><use href="#mari" x="722" y="174"/><use href="#mariY" x="722" y="196"/>
  </g>

  <!-- mango leaf toran -->
  <path d="M100 18 Q400 70 700 18" fill="none" stroke="#8C6A2E" stroke-width="2"/>
  <g>
    <use href="#leaf" transform="translate(140 30) rotate(8)"/>
    <use href="#mariY" x="175" y="38"/>
    <use href="#leaf" transform="translate(210 44) rotate(6)"/>
    <use href="#mari" x="245" y="49"/>
    <use href="#leaf" transform="translate(280 53) rotate(3)"/>
    <use href="#mariY" x="315" y="56"/>
    <use href="#leaf" transform="translate(350 58)"/>
    <use href="#mari" x="385" y="60"/>
    <use href="#leaf" transform="translate(420 59)"/>
    <use href="#mariY" x="455" y="57"/>
    <use href="#leaf" transform="translate(490 55) rotate(-3)"/>
    <use href="#mari" x="525" y="51"/>
    <use href="#leaf" transform="translate(560 46) rotate(-6)"/>
    <use href="#mariY" x="595" y="40"/>
    <use href="#leaf" transform="translate(630 34) rotate(-8)"/>
  </g>

  <!-- low wooden stool (patla) -->
  <rect x="270" y="452" width="260" height="22" rx="4" fill="#9A6A3A"/>
  <rect x="285" y="474" width="18" height="22" fill="#7E5530"/>
  <rect x="497" y="474" width="18" height="22" fill="#7E5530"/>

  <!-- groom, seen from behind -->
  <g>
    <!-- dhoti / pyjama spreading over the stool -->
    <path d="M318 395 C 300 430, 262 450, 250 470 L 550 470 C 538 450, 500 430, 482 395 Z" fill="url(#dhoti)"/>
    <path d="M330 420 C 360 440, 440 440, 470 420" fill="none" stroke="#E2D6B6" stroke-width="2"/>
    <!-- arms resting forward -->
    <path d="M306 290 C 286 330, 284 380, 300 420 L 322 418 C 312 380, 316 340, 330 305 Z" fill="url(#skin)"/>
    <path d="M494 290 C 514 330, 516 380, 500 420 L 478 418 C 488 380, 484 340, 470 305 Z" fill="url(#skin)"/>
    <!-- bare back -->
    <path d="M330 268 C 360 252, 440 252, 470 268 C 498 282, 506 300, 496 330 C 486 360, 484 380, 482 400 L 318 400 C 316 380, 314 360, 304 330 C 294 300, 302 282, 330 268 Z" fill="url(#skin)"/>
    <path d="M400 272 C 398 320, 400 360, 400 398" stroke="#A9683E" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M352 300 C 368 312, 380 312, 388 306 M448 300 C 432 312, 420 312, 412 306" stroke="#A9683E" stroke-width="2" fill="none" opacity="0.45"/>
    <!-- haldi smeared on shoulders and back -->
    <g fill="#ECB51F" opacity="0.88">
      <path d="M330 268 C 352 256, 380 254, 392 262 C 388 284, 360 300, 334 300 C 318 296, 316 278, 330 268 Z"/>
      <path d="M470 268 C 448 256, 420 254, 408 262 C 412 284, 440 300, 466 300 C 482 296, 484 278, 470 268 Z"/>
      <path d="M372 330 C 392 322, 414 326, 424 340 C 420 360, 392 366, 376 356 C 366 348, 364 336, 372 330 Z" opacity="0.8"/>
      <path d="M300 300 C 310 296, 318 304, 316 326 C 312 340, 300 338, 296 324 Z"/>
      <path d="M500 300 C 490 296, 482 304, 484 326 C 488 340, 500 338, 504 324 Z"/>
    </g>
    <!-- neck and head (back of head, hair only) -->
    <path d="M378 226 L 422 226 L 426 268 L 374 268 Z" fill="#B97A4C"/>
    <ellipse cx="344" cy="202" rx="8" ry="13" fill="#B97A4C"/>
    <ellipse cx="456" cy="202" rx="8" ry="13" fill="#B97A4C"/>
    <path d="M400 140 C 438 140, 458 168, 456 204 C 454 228, 440 240, 420 242 C 408 238, 392 238, 380 242 C 360 240, 346 228, 344 204 C 342 168, 362 140, 400 140 Z" fill="#2A1F17"/>
    <path d="M372 160 C 388 150, 414 150, 430 162" stroke="#4A3A2C" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- family hands applying haldi, reaching in from either side -->
  <g stroke-linecap="round" fill="none">
    <path d="M120 120 L 250 210" stroke="#D0607F" stroke-width="40"/>
    <path d="M236 200 L 250 210" stroke="#E2B84E" stroke-width="42"/>
    <path d="M250 210 L 318 258" stroke="#C98A5A" stroke-width="24"/>
    <path d="M269.5 207.4 L 254.5 228.6" stroke="#B5302B" stroke-width="6"/><path d="M278.5 213.9 L 263.5 235.1" stroke="#D9A93C" stroke-width="6"/><path d="M287.5 220.4 L 272.5 241.6" stroke="#B5302B" stroke-width="6"/>
    <path d="M680 120 L 550 210" stroke="#2F7A65" stroke-width="40"/>
    <path d="M564 200 L 550 210" stroke="#E2B84E" stroke-width="42"/>
    <path d="M550 210 L 482 258" stroke="#BF7F50" stroke-width="24"/>
    <path d="M545.5 228.6 L 530.5 207.4" stroke="#2F7A65" stroke-width="6"/><path d="M536.5 235.1 L 521.5 213.9" stroke="#D9A93C" stroke-width="6"/><path d="M527.5 241.6 L 512.5 220.4" stroke="#2F7A65" stroke-width="6"/>
  </g>
  <path d="M306 248 C 326 244, 346 254, 350 270 C 342 282, 316 282, 302 272 Z" fill="#C98A5A"/>
  <path d="M316 256 C 330 258, 342 264, 346 270" stroke="#ECB51F" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M494 248 C 474 244, 454 254, 450 270 C 458 282, 484 282, 498 272 Z" fill="#BF7F50"/>
  <path d="M484 256 C 470 258, 458 264, 454 270" stroke="#ECB51F" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- brass bowl of haldi and petals -->
  <g transform="translate(150 470)">
    <ellipse cx="0" cy="34" rx="62" ry="10" fill="#C8A462" opacity="0.35"/>
    <path d="M-56 0 C -52 30, -28 40, 0 40 C 28 40, 52 30, 56 0 Z" fill="url(#brass)"/>
    <ellipse cx="0" cy="0" rx="56" ry="12" fill="#C99A3C"/>
    <ellipse cx="0" cy="1" rx="48" ry="9" fill="#EDB421"/>
    <ellipse cx="-12" cy="-1" rx="16" ry="4" fill="#F7D05A"/>
  </g>
  <g transform="translate(650 485)">
    <ellipse cx="0" cy="22" rx="46" ry="8" fill="#C8A462" opacity="0.35"/>
    <path d="M-42 0 C -38 22, -20 28, 0 28 C 20 28, 38 22, 42 0 Z" fill="url(#brass)"/>
    <ellipse cx="0" cy="0" rx="42" ry="9" fill="#C99A3C"/>
    <use href="#mari" x="-16" y="-4"/><use href="#mariY" x="6" y="-6"/><use href="#mari" x="22" y="-2"/>
  </g>
  <g fill="#E8892A">
    <circle cx="232" cy="520" r="4"/><circle cx="560" cy="530" r="4"/><circle cx="600" cy="560" r="3"/><circle cx="210" cy="565" r="3"/>
  </g>
  <g fill="#F2C440">
    <circle cx="250" cy="548" r="3"/><circle cx="584" cy="512" r="3"/><circle cx="330" cy="580" r="3"/><circle cx="480" cy="582" r="4"/>
  </g>
</svg>
