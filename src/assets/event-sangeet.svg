<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="The bride and groom seen from behind in modern outfits, arm in arm under string lights">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17251F"/>
      <stop offset="0.7" stop-color="#2D4436"/>
      <stop offset="1" stop-color="#3A5243"/>
    </linearGradient>
    <radialGradient id="stage" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#F3D99A" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#F3D99A" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#F3D99A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A3F2C"/>
      <stop offset="1" stop-color="#231D14"/>
    </linearGradient>
    <linearGradient id="gown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EBC3B4"/>
      <stop offset="1" stop-color="#D79F8D"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1B2433"/>
      <stop offset="0.5" stop-color="#26324A"/>
      <stop offset="1" stop-color="#18202E"/>
    </linearGradient>
    <radialGradient id="bulb">
      <stop offset="0" stop-color="#FFF4C8"/>
      <stop offset="0.35" stop-color="#F6D27A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F6D27A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sparkle" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="5" r="1.3" fill="#F7E3B0" opacity="0.9"/>
      <circle cx="13" cy="13" r="1" fill="#FFFFFF" opacity="0.7"/>
    </pattern>
    <g id="b"><circle r="16" fill="url(#bulb)"/><circle r="3" fill="#FFF8DC"/></g>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- soft bokeh -->
  <g fill="#E9C77B">
    <circle cx="90" cy="250" r="26" opacity="0.10"/><circle cx="170" cy="330" r="18" opacity="0.12"/>
    <circle cx="660" cy="270" r="30" opacity="0.10"/><circle cx="720" cy="360" r="16" opacity="0.14"/>
    <circle cx="590" cy="180" r="14" opacity="0.12"/><circle cx="230" cy="200" r="12" opacity="0.14"/>
  </g>
  <g fill="#C8A8D8">
    <circle cx="130" cy="390" r="20" opacity="0.08"/><circle cx="690" cy="420" r="22" opacity="0.08"/>
  </g>

  <!-- string lights -->
  <g fill="none" stroke="#6B5A3A" stroke-width="1.5">
    <path d="M-10 40 Q200 150 410 60"/>
    <path d="M390 60 Q600 150 810 40"/>
    <path d="M-10 120 Q400 260 810 120"/>
  </g>
  <g>
    <use href="#b" x="30" y="58"/><use href="#b" x="80" y="80"/><use href="#b" x="130" y="96"/><use href="#b" x="180" y="104"/><use href="#b" x="230" y="104"/><use href="#b" x="280" y="98"/><use href="#b" x="330" y="86"/><use href="#b" x="375" y="72"/>
    <use href="#b" x="425" y="72"/><use href="#b" x="470" y="86"/><use href="#b" x="520" y="98"/><use href="#b" x="570" y="104"/><use href="#b" x="620" y="104"/><use href="#b" x="670" y="96"/><use href="#b" x="720" y="80"/><use href="#b" x="770" y="58"/>
    <use href="#b" x="40" y="140"/><use href="#b" x="110" y="162"/><use href="#b" x="180" y="178"/><use href="#b" x="250" y="188"/><use href="#b" x="320" y="193"/><use href="#b" x="400" y="194"/><use href="#b" x="480" y="193"/><use href="#b" x="550" y="188"/><use href="#b" x="620" y="178"/><use href="#b" x="690" y="162"/><use href="#b" x="760" y="140"/>
  </g>

  <!-- dance floor with warm stage glow -->
  <path d="M0 470 H800 V600 H0 Z" fill="url(#floor)"/>
  <rect width="800" height="600" fill="url(#stage)" opacity="0.8"/>
  <g stroke="#6E5C3C" stroke-width="1" opacity="0.6">
    <path d="M400 470 L 120 600 M400 470 L 260 600 M400 470 L 400 600 M400 470 L 540 600 M400 470 L 680 600"/>
    <path d="M0 505 H800 M0 548 H800"/>
  </g>

  <!-- reflection -->
  <ellipse cx="400" cy="540" rx="170" ry="24" fill="#F3D99A" opacity="0.12"/>

  <!-- groom, seen from behind: slim midnight bandhgala and trousers -->
  <g>
    <path d="M432 398 L 428 548 L 458 548 L 462 410 Z" fill="#141B27"/>
    <path d="M476 410 L 482 548 L 512 548 L 508 398 Z" fill="#141B27"/>
    <path d="M424 548 C 424 540, 460 540, 462 548 Z M480 548 C 480 540, 516 540, 516 548 Z" fill="#0C0F15"/>
    <path d="M412 238 C 436 226, 486 226, 510 238 C 530 248, 534 262, 532 290 L 522 410 L 418 410 L 410 300 Z" fill="url(#suit)"/>
    <path d="M466 236 L 466 410" stroke="#0F1520" stroke-width="2"/>
    <path d="M466 380 L 466 410" stroke="#0F1520" stroke-width="3"/>
    <!-- right arm hanging -->
    <path d="M520 246 C 540 262, 546 300, 544 350 L 540 384 L 522 384 L 524 340 C 524 300, 518 280, 508 266 Z" fill="#1E283B"/>
    <path d="M522 384 L 540 384 L 539 398 C 534 404, 526 404, 522 398 Z" fill="#B57A50"/>
    <!-- collar, neck, head (hair only) -->
    <path d="M446 218 L 486 218 L 488 238 L 444 238 Z" fill="#B27650"/>
    <path d="M442 230 C 456 240, 476 240, 490 230 L 490 242 C 476 250, 456 250, 442 242 Z" fill="#0F1520"/>
    <ellipse cx="434" cy="186" rx="6" ry="11" fill="#B27650"/>
    <ellipse cx="498" cy="186" rx="6" ry="11" fill="#B27650"/>
    <path d="M466 138 C 494 138, 504 160, 502 188 C 500 206, 490 218, 478 222 L 454 222 C 442 218, 432 206, 430 188 C 428 160, 438 138, 466 138 Z" fill="#221A14"/>
    <path d="M446 152 C 458 144, 476 144, 488 154" stroke="#3E3226" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- bride, seen from behind: modern blush gown, hair in a low bun with flowers -->
  <g>
    <path d="M338 330 C 316 400, 286 470, 262 552 C 330 566, 420 566, 470 552 C 448 470, 420 400, 400 330 Z" fill="url(#gown)"/>
    <path d="M338 330 C 316 400, 286 470, 262 552 C 330 566, 420 566, 470 552 C 448 470, 420 400, 400 330 Z" fill="url(#sparkle)"/>
    <path d="M300 470 C 320 500, 330 530, 324 560 M372 400 C 380 450, 390 500, 392 562 M420 440 C 432 480, 440 520, 446 556" stroke="#C88E7C" stroke-width="2" fill="none" opacity="0.7"/>
    <!-- open back with fitted bodice -->
    <path d="M342 250 C 352 240, 390 240, 400 250 C 408 270, 406 300, 402 334 L 336 334 C 332 300, 332 270, 342 250 Z" fill="#B47A57"/>
    <path d="M334 300 C 350 290, 390 290, 406 300 L 404 336 L 334 336 Z" fill="url(#gown)"/>
    <path d="M334 300 C 350 290, 390 290, 406 300 L 404 336 L 334 336 Z" fill="url(#sparkle)"/>
    <path d="M346 250 L 342 300 M396 250 L 400 300" stroke="#E2B6A6" stroke-width="3"/>
    <path d="M370 252 C 370 270, 370 290, 370 300" stroke="#9E6646" stroke-width="1.5" opacity="0.6"/>
    <!-- left arm -->
    <path d="M342 254 C 324 274, 318 310, 320 346 L 324 380 L 338 378 L 336 340 C 336 310, 340 288, 348 272 Z" fill="#B47A57"/>
    <g stroke="#E3C26E" stroke-width="3"><path d="M321 362 L 337 360 M321 368 L 337 366"/></g>
    <!-- her right arm around his back -->
    <path d="M398 256 C 414 270, 426 300, 432 320 C 438 330, 448 334, 456 328 L 452 314 C 446 316, 444 312, 440 300 C 434 282, 424 262, 408 248 Z" fill="#B47A57"/>
    <!-- neck, earrings, head -->
    <path d="M358 222 L 384 222 L 386 248 L 356 248 Z" fill="#B47A57"/>
    <ellipse cx="341" cy="196" rx="5" ry="9" fill="#B47A57"/>
    <ellipse cx="401" cy="196" rx="5" ry="9" fill="#B47A57"/>
    <g fill="#E3C26E"><circle cx="340" cy="212" r="3"/><circle cx="340" cy="222" r="4.5"/><circle cx="402" cy="212" r="3"/><circle cx="402" cy="222" r="4.5"/></g>
    <path d="M371 150 C 396 150, 406 170, 404 196 C 402 212, 394 222, 384 226 L 358 226 C 348 222, 340 212, 338 196 C 336 170, 346 150, 371 150 Z" fill="#1F1712"/>
    <!-- low bun with gajra -->
    <ellipse cx="371" cy="226" rx="24" ry="17" fill="#1A130F"/>
    <g fill="#FFF8EA">
      <circle cx="348" cy="230" r="3.5"/><circle cx="350" cy="221" r="3.5"/><circle cx="355" cy="213" r="3.5"/><circle cx="363" cy="208" r="3.5"/><circle cx="371" cy="206" r="3.5"/><circle cx="379" cy="208" r="3.5"/><circle cx="387" cy="213" r="3.5"/><circle cx="392" cy="221" r="3.5"/><circle cx="394" cy="230" r="3.5"/>
    </g>
    <path d="M356 224 C 364 232, 378 232, 386 224" stroke="#2E231C" stroke-width="2" fill="none"/>
  </g>
</svg>
